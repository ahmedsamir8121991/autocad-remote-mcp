name: Verified build

# Builds AutoCADRemoteMCP.exe from this repository's source on GitHub's own Windows machine,
# runs its self-test, and signs a build attestation so anyone can check that a download
# was built from this exact code:
#   gh attestation verify AutoCADRemoteMCP.exe --repo ahmedsamir8121991/autocad-remote-mcp

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # attach files to the release on a version tag
  id-token: write        # needed to sign the attestation
  attestations: write

env:
  PRO_ENGINE_REPO: https://github.com/U-C4N/Autocad-MCP
  PRO_ENGINE_COMMIT: 6f6a538255ca9f885232e845ac32f10b4433fe3e

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the AutoCAD MCP Pro engine (pinned commit)
        shell: pwsh
        run: |
          git clone $env:PRO_ENGINE_REPO C:\autocad-mcp-pro
          git -C C:\autocad-mcp-pro checkout $env:PRO_ENGINE_COMMIT

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements-build.txt
          .venv\Scripts\python.exe -m pip install --no-deps C:\autocad-mcp-pro

      - name: Build the exe
        shell: pwsh
        run: .\build.ps1

      - name: Self-test the exe (loads every tool, no AutoCAD needed)
        shell: pwsh
        run: |
          $out = & dist\AutoCADRemoteMCP.exe --selftest
          $out
          if ($LASTEXITCODE -ne 0 -or ($out -join "`n") -match 'MISSING') { throw "self-test failed" }

      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AutoCADRemoteMCP.exe, dist\README.txt, dist\LICENSE-AutoCAD-MCP-Pro.txt -DestinationPath dist\AutoCADRemoteMCP.zip
          Get-FileHash dist\AutoCADRemoteMCP.exe, dist\AutoCADRemoteMCP.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Sign build attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/AutoCADRemoteMCP.exe
            dist/AutoCADRemoteMCP.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AutoCADRemoteMCP-${{ github.sha }}
          path: |
            dist/AutoCADRemoteMCP.exe
            dist/AutoCADRemoteMCP.zip
            dist/README.txt
            dist/LICENSE-AutoCAD-MCP-Pro.txt
            dist/SHA256SUMS.txt

      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist\AutoCADRemoteMCP.exe dist\AutoCADRemoteMCP.zip dist\SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
