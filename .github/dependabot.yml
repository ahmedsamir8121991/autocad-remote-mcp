# Routine version-update pull requests are off (limit 0): build dependencies are pinned on purpose
# for verified builds. Dependabot security alerts stay on in the repository settings.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
